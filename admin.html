<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Back Office | Redlum International</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --red:#ff000d; --black:#0a0a0a; --white:#f8f6f2; --grey-light:#f0ede8; --grey-mid:#c8c4bc; --grey-dark:#4a4643; --gold:#b8a882; }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Montserrat',sans-serif; background:var(--grey-light); color:var(--black); min-height:100vh; }
  .logo { font-family:'Cormorant Garamond',serif; font-size:1.5rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; }
  .logo .red { color:var(--red); }
  .logo small { font-family:'Montserrat',sans-serif; font-size:0.5rem; letter-spacing:0.35em; color:var(--gold); margin-left:0.6rem; }
  .hidden { display:none !important; }
  label { display:block; font-size:0.58rem; font-weight:600; letter-spacing:0.25em; text-transform:uppercase; color:var(--grey-dark); margin-bottom:0.5rem; }
  input[type=text],input[type=email],input[type=password],input[type=file] { width:100%; padding:0.8rem 1rem; border:1px solid var(--grey-mid); background:#fff; font-family:inherit; font-size:0.8rem; margin-bottom:1.1rem; }
  input:focus { outline:none; border-color:var(--black); }
  button { font-family:inherit; font-size:0.62rem; font-weight:600; letter-spacing:0.25em; text-transform:uppercase; cursor:pointer; padding:0.9rem 1.6rem; background:var(--black); color:var(--white); border:2px solid var(--black); transition:all .3s; }
  button:hover { background:var(--red); border-color:var(--red); }
  button:disabled { opacity:.5; cursor:wait; }
  .btn-ghost { background:transparent; color:var(--grey-dark); border-color:var(--grey-mid); }
  .btn-ghost:hover { background:var(--black); border-color:var(--black); color:var(--white); }
  .msg { font-size:0.75rem; margin-bottom:1rem; min-height:1em; }
  .msg.err { color:var(--red); } .msg.ok { color:#2d6a2d; }

  /* Login */
  #login { max-width:400px; margin:12vh auto 0; background:#fff; padding:2.6rem 2.4rem; border-top:3px solid var(--red); }
  #login h1 { font-family:'Cormorant Garamond',serif; font-weight:300; font-size:2rem; margin:1.2rem 0 1.8rem; }
  #login button { width:100%; }

  /* Dashboard */
  .bar { display:flex; justify-content:space-between; align-items:center; background:#fff; padding:1rem 2.5rem; border-bottom:1px solid var(--grey-mid); }
  .bar-right { display:flex; align-items:center; gap:1.2rem; font-size:0.7rem; color:var(--grey-dark); }
  .bar a { color:var(--grey-dark); font-size:0.62rem; letter-spacing:0.15em; text-transform:uppercase; text-decoration:none; }
  .bar a:hover { color:var(--red); }
  .wrap { max-width:1100px; margin:2.5rem auto; padding:0 2rem; }
  .panel { background:#fff; padding:2rem 2.2rem; margin-bottom:2rem; }
  .panel h2 { font-family:'Cormorant Garamond',serif; font-weight:400; font-size:1.6rem; margin-bottom:1.4rem; }
  .hint { font-size:0.68rem; color:var(--grey-dark); font-weight:300; margin:-0.6rem 0 1.2rem; }
  table { width:100%; border-collapse:collapse; font-size:0.78rem; }
  th { text-align:left; font-size:0.56rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--gold); font-weight:600; padding:0 0.8rem 0.8rem 0; border-bottom:1px solid var(--grey-mid); }
  td { padding:0.9rem 0.8rem 0.9rem 0; border-bottom:1px solid var(--grey-light); vertical-align:middle; word-break:break-word; }
  td img { width:52px; height:40px; object-fit:cover; display:block; }
  .ftype { display:inline-block; width:52px; text-align:center; font-size:0.6rem; font-weight:600; letter-spacing:0.1em; background:var(--grey-light); padding:0.7rem 0; }
  td a { color:var(--black); }
  .del { padding:0.5rem 0.9rem; font-size:0.55rem; background:transparent; color:var(--red); border-color:var(--red); }
  .del:hover { background:var(--red); color:#fff; }
  .enq-msg { white-space:pre-wrap; max-width:340px; font-size:0.74rem; line-height:1.6; }
  .badge { display:inline-block; font-size:0.52rem; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; padding:0.3rem 0.6rem; }
  .badge.new { background:var(--red); color:#fff; } .badge.done { background:var(--grey-light); color:var(--grey-dark); }
  .small-btn { padding:0.5rem 0.9rem; font-size:0.55rem; background:transparent; color:var(--grey-dark); border-color:var(--grey-mid); margin-right:0.4rem; }
  .small-btn:hover { background:var(--black); border-color:var(--black); color:#fff; }
  @media (max-width:760px){ .bar{padding:1rem 1.2rem;} .wrap{padding:0 1rem;} .hide-sm{display:none;} }
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" class="hidden">
  <div class="logo"><span class="red">Red</span>lum<small>BACK OFFICE</small></div>
  <h1>Sign in</h1>
  <form id="login-form">
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <p class="msg err" id="login-msg"></p>
    <button type="submit" id="login-btn">Sign in</button>
  </form>
</section>

<!-- DASHBOARD -->
<section id="dash" class="hidden">
  <div class="bar">
    <div class="logo"><span class="red">Red</span>lum<small>BACK OFFICE</small></div>
    <div class="bar-right">
      <a href="media.html" target="_blank">View media page</a>
      <span id="who"></span>
      <button class="btn-ghost" id="logout" style="padding:0.6rem 1.1rem;">Sign out</button>
    </div>
  </div>

  <div class="wrap">
    <div class="panel">
      <h2>Enquiries <span id="enq-count" style="font-size:1rem;color:var(--grey-dark);"></span></h2>
      <p class="msg" id="enq-status"></p>
      <div style="margin-bottom:1.2rem;"><button class="btn-ghost" id="export-csv" style="padding:0.6rem 1.1rem;">Export CSV</button></div>
      <table>
        <thead><tr><th>Received</th><th>From</th><th class="hide-sm">Interest</th><th>Message</th><th>Status</th><th></th></tr></thead>
        <tbody id="enq-rows"></tbody>
      </table>
    </div>

    <div class="panel">
      <h2>Upload media</h2>
      <p class="hint" id="allowed-hint"></p>
      <form id="upload-form">
        <label for="title">Title (optional)</label>
        <input type="text" id="title" placeholder="e.g. Company profile 2026">
        <label for="file">File(s)</label>
        <input type="file" id="file" multiple required>
        <p class="msg" id="upload-msg"></p>
        <button type="submit" id="upload-btn">Upload</button>
      </form>
    </div>

    <div class="panel">
      <h2>Library</h2>
      <p class="msg" id="list-msg"></p>
      <table>
        <thead><tr><th></th><th>Title / File</th><th class="hide-sm">Size</th><th>Uploaded</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script>
  const C = window.REDLUM_CONFIG;
  const sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
  const $ = id => document.getElementById(id);

  function fmtSize(b){ if(!b) return ''; return b<1048576 ? Math.round(b/1024)+' KB' : (b/1048576).toFixed(1)+' MB'; }
  function fmtDate(d){ return new Date(d).toLocaleString('en-AU',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}); }
  function ext(n){ const p=n.split('.'); return p.length>1 ? p.pop().toUpperCase().slice(0,4) : 'FILE'; }
  function safeName(n){ return n.replace(/[^a-zA-Z0-9._-]/g,'_'); }

  $('allowed-hint').textContent = 'Images, PDF, Word, Excel, PowerPoint and MP4. Maximum ' + C.MAX_FILE_MB + ' MB per file.';
  $('file').setAttribute('accept', C.ALLOWED_TYPES.join(','));

  function show(session){
    $('login').classList.toggle('hidden', !!session);
    $('dash').classList.toggle('hidden', !session);
    if (session) { $('who').textContent = session.user.email; loadEnquiries(); loadList(); }
  }

  sb.auth.getSession().then(({data}) => show(data.session));
  sb.auth.onAuthStateChange((_e, session) => show(session));

  // Login
  $('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    $('login-btn').disabled = true; $('login-msg').textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email:$('email').value.trim(), password:$('password').value });
    $('login-btn').disabled = false;
    if (error) $('login-msg').textContent = 'Sign in failed. Check your email and password.';
    else $('password').value = '';
  });
  $('logout').addEventListener('click', () => sb.auth.signOut());

  // List
  async function loadList(){
    const { data, error } = await sb.from('media_items').select('*').order('uploaded_at',{ascending:false});
    const rows = $('rows'); rows.innerHTML = '';
    if (error) { $('list-msg').className='msg err'; $('list-msg').textContent = 'Could not load the library.'; return; }
    $('list-msg').textContent = data.length ? '' : 'Nothing uploaded yet.';
    data.forEach(item => {
      const url = sb.storage.from(C.BUCKET).getPublicUrl(item.file_path).data.publicUrl;
      const tr = document.createElement('tr');

      const td1 = document.createElement('td');
      if ((item.mime_type||'').startsWith('image/')) { const i=document.createElement('img'); i.src=url; i.alt=''; td1.appendChild(i); }
      else { const s=document.createElement('span'); s.className='ftype'; s.textContent=ext(item.file_name); td1.appendChild(s); }

      const td2 = document.createElement('td');
      const a = document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener'; a.textContent = item.title || item.file_name;
      td2.appendChild(a);
      if (item.title) { const f=document.createElement('div'); f.style.cssText='font-size:0.65rem;color:#4a4643;margin-top:2px;'; f.textContent=item.file_name; td2.appendChild(f); }

      const td3 = document.createElement('td'); td3.className='hide-sm'; td3.textContent = fmtSize(item.size_bytes);
      const td4 = document.createElement('td'); td4.textContent = fmtDate(item.uploaded_at);

      const td5 = document.createElement('td');
      const b = document.createElement('button'); b.className='del'; b.textContent='Delete';
      b.addEventListener('click', () => del(item, b));
      td5.appendChild(b);

      tr.append(td1, td2, td3, td4, td5); rows.appendChild(tr);
    });
  }

  // Upload
  $('upload-form').addEventListener('submit', async e => {
    e.preventDefault();
    const msg = $('upload-msg'); msg.className='msg'; msg.textContent='';
    const files = Array.from($('file').files);
    const title = $('title').value.trim();
    const maxBytes = C.MAX_FILE_MB * 1048576;

    for (const f of files) {
      if (!C.ALLOWED_TYPES.includes(f.type)) { msg.className='msg err'; msg.textContent = '"'+f.name+'" is not an allowed file type.'; return; }
      if (f.size > maxBytes) { msg.className='msg err'; msg.textContent = '"'+f.name+'" is larger than '+C.MAX_FILE_MB+' MB.'; return; }
    }

    $('upload-btn').disabled = true;
    let done = 0;
    for (const f of files) {
      msg.textContent = 'Uploading ' + (done+1) + ' of ' + files.length + '…';
      const path = Date.now() + '-' + safeName(f.name);
      const up = await sb.storage.from(C.BUCKET).upload(path, f, { contentType:f.type });
      if (up.error) { msg.className='msg err'; msg.textContent = 'Upload failed for "'+f.name+'".'; break; }
      const ins = await sb.from('media_items').insert({
        title: (files.length === 1 && title) ? title : null,
        file_name: f.name, file_path: path, mime_type: f.type, size_bytes: f.size
      });
      if (ins.error) {
        await sb.storage.from(C.BUCKET).remove([path]);
        msg.className='msg err'; msg.textContent = 'Could not record "'+f.name+'".'; break;
      }
      done++;
    }
    $('upload-btn').disabled = false;
    if (done === files.length) { msg.className='msg ok'; msg.textContent = done + ' file' + (done>1?'s':'') + ' uploaded.'; $('upload-form').reset(); }
    loadList();
  });

  // Delete
  async function del(item, btn){
    if (!confirm('Permanently delete "' + (item.title || item.file_name) + '"? This cannot be undone.')) return;
    btn.disabled = true;
    const r1 = await sb.storage.from(C.BUCKET).remove([item.file_path]);
    if (r1.error) { alert('Could not delete the file.'); btn.disabled=false; return; }
    const r2 = await sb.from('media_items').delete().eq('id', item.id);
    if (r2.error) { alert('File removed but the record could not be deleted.'); }
    loadList();
  }

  // ---------- Enquiries ----------
  let enquiryCache = [];
  async function loadEnquiries(){
    const { data, error } = await sb.from('enquiries').select('*').order('created_at',{ascending:false});
    const rows = $('enq-rows'); rows.innerHTML = '';
    if (error) { $('enq-status').className='msg err'; $('enq-status').textContent='Could not load enquiries. Has the enquiries SQL been run?'; return; }
    enquiryCache = data;
    const open = data.filter(d => d.status !== 'done').length;
    $('enq-count').textContent = data.length ? '(' + data.length + ' total, ' + open + ' new)' : '';
    $('enq-status').className='msg'; $('enq-status').textContent = data.length ? '' : 'No enquiries yet.';
    data.forEach(item => {
      const tr = document.createElement('tr');
      const tdDate = document.createElement('td'); tdDate.textContent = fmtDate(item.created_at);

      const tdFrom = document.createElement('td');
      const nm = document.createElement('div'); nm.style.fontWeight='500'; nm.textContent = item.name;
      const em = document.createElement('a'); em.href = 'mailto:' + encodeURIComponent(item.email).replace('%40','@'); em.textContent = item.email; em.style.display='block';
      tdFrom.append(nm, em);
      if (item.phone) { const ph = document.createElement('div'); ph.style.fontSize='0.72rem'; ph.textContent = item.phone; tdFrom.appendChild(ph); }

      const tdSvc = document.createElement('td'); tdSvc.className='hide-sm'; tdSvc.textContent = item.service || '';
      const tdMsg = document.createElement('td'); const m = document.createElement('div'); m.className='enq-msg'; m.textContent = item.message; tdMsg.appendChild(m);

      const tdStat = document.createElement('td');
      const badge = document.createElement('span'); const isDone = item.status === 'done';
      badge.className = 'badge ' + (isDone ? 'done' : 'new'); badge.textContent = isDone ? 'Done' : 'New'; tdStat.appendChild(badge);

      const tdAct = document.createElement('td'); tdAct.style.whiteSpace='nowrap';
      const t = document.createElement('button'); t.className='small-btn'; t.textContent = isDone ? 'Reopen' : 'Mark done';
      t.addEventListener('click', async () => {
        t.disabled = true;
        const r = await sb.from('enquiries').update({ status: isDone ? 'new' : 'done' }).eq('id', item.id);
        if (r.error) alert('Could not update.');
        loadEnquiries();
      });
      const d = document.createElement('button'); d.className='del'; d.textContent='Delete';
      d.addEventListener('click', async () => {
        if (!confirm('Permanently delete the enquiry from ' + item.name + '? This cannot be undone.')) return;
        const r = await sb.from('enquiries').delete().eq('id', item.id);
        if (r.error) alert('Could not delete.');
        loadEnquiries();
      });
      tdAct.append(t, d);

      tr.append(tdDate, tdFrom, tdSvc, tdMsg, tdStat, tdAct); rows.appendChild(tr);
    });
  }

  $('export-csv').addEventListener('click', () => {
    if (!enquiryCache.length) { alert('There are no enquiries to export.'); return; }
    const cols = ['created_at','name','email','phone','service','message','status'];
    const cell = v => {
      let t = (v == null ? '' : String(v));
      if (/^[=+\-@]/.test(t)) t = "'" + t;   // stop spreadsheet formula injection
      return '"' + t.replace(/"/g,'""') + '"';
    };
    const csv = [cols.join(',')].concat(enquiryCache.map(r => cols.map(c => cell(r[c])).join(','))).join('\r\n');
    const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    const a = document.createElement('a'); a.href = url; a.download = 'redlum-enquiries.csv'; a.click();
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
